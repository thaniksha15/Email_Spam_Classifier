<!DOCTYPE html>
<html>
<head>
    <title>Email Spam Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            margin-bottom: 25px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📧 Email Spam Classifier</h1>

    <textarea id="message" placeholder="Enter your email message here..."></textarea>

    <br>

    <button onclick="predictSpam()">Check Message</button>

    <div id="result"></div>

</div>

<script>
    function predictSpam() {

        const message = document.getElementById("message").value;

        if (message.trim() === "") {
            document.getElementById("result").innerHTML =
                "Please enter a message.";
            return;
        }

        fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        })

        .then(response => response.json())

        .then(data => {
            document.getElementById("result").innerHTML =
                "Prediction: " + data.prediction;
        })

        .catch(error => {
            document.getElementById("result").innerHTML =
                "Error occurred!";
        });
    }
</script>

</body>
</html>
